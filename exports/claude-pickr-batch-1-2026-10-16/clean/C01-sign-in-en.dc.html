<!doctype html>
<html lang="en">
<head><meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>C01 Sign in</title>

</head>
<body>


<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&amp;family=Noto+Sans+Malayalam:wght@400;500;600;700&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ic{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.fill{font-variation-settings:'FILL' 1}
a{color:#B44718}a:hover{color:#963A12}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 40px 16px 24px; background: #FAFAF7; color: #18221F; font-family: 'Noto Sans', 'Noto Sans Malayalam', sans-serif; display: flex; flex-direction: column; gap: 32px">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="display: flex; align-items: center; gap: 10px">
<div style="width: 40px; height: 40px; border-radius: 12px; background: #B44718; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><span class="ic fill" aria-hidden="true">local_shipping</span></div>
<span style="font-size: 20px; font-weight: 700; letter-spacing: 0.04em">PICKR</span>
</div>
<div role="group" aria-label="Language" style="display: flex; border: 1px solid #DCDFD8; border-radius: 999px; padding: 3px; background: #FFFFFF">
<button type="button" aria-pressed="true" style="height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #18221F; color: #FFFFFF; font: 600 14px 'Noto Sans', sans-serif">English</button>
<button type="button" aria-pressed="false" style="height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #18221F; font: 500 14px 'Noto Sans Malayalam', sans-serif">മലയാളം</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.25">Book a truck for your site</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #68736E">Construction materials and site transfers, from pickup to delivery.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c01-name" style="font-size: 14px; font-weight: 500">Your name</label>
<input id="c01-name" type="text" placeholder="Name" style="height: 56px; box-sizing: border-box; border: 1.5px solid #DCDFD8; border-radius: 12px; padding: 0 16px; font: 400 17px 'Noto Sans', sans-serif; color: #18221F; background: #FFFFFF">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="c01-phone" style="font-size: 14px; font-weight: 500">Phone number</label>
<div style="display: flex; height: 56px; box-sizing: border-box; border: 1.5px solid #DCDFD8; border-radius: 12px; overflow: hidden; background: #FFFFFF">
<span style="display: flex; align-items: center; padding: 0 14px; background: #F3F4F0; font-size: 17px; border-right: 1px solid #DCDFD8">+91</span>
<input id="c01-phone" type="tel" inputmode="numeric" placeholder="10-digit mobile number" style="flex: 1; min-width: 0; border: 0; padding: 0 14px; font: 400 17px 'Noto Sans', sans-serif; color: #18221F">
</div>
</div>
</div>

<div style="flex-grow: 1"></div>

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.5; color: #46504C">
<span class="ic" aria-hidden="true" style="font-size: 20px; color: #68736E">info</span>
<span>Private pilot. Your phone number is not verified by OTP. We use it only to contact you about your trips.</span>
</div>
<a href="C02-home-en.dc.html" style="height: 56px; border-radius: 14px; background: #B44718; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Continue</a>
</div>

</div>


</body>
</html>
