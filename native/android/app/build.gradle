plugins { id 'com.android.application' }
if(file('google-services.json').exists()) { apply plugin: 'com.google.gms.google-services' }
android {
 namespace 'in.pickr.pilot'
 compileSdk 35
 defaultConfig { applicationId 'in.pickr.pilot'; minSdk 26; targetSdk 35; versionCode 10; versionName '0.9.1-pilot'; buildConfigField 'String','BACKEND_URL',groovy.json.JsonOutput.toJson(System.getenv('PICKR_BACKEND_URL') ?: '') }
 buildFeatures { buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 flavorDimensions += 'role'
 productFlavors {
 customer { dimension 'role'; applicationIdSuffix '.customer'; resValue 'string','app_name','PICKR Customer'; buildConfigField 'String','APP_ROLE','"customer"' }
 driver { dimension 'role'; applicationIdSuffix '.driver'; resValue 'string','app_name','PICKR Driver'; buildConfigField 'String','APP_ROLE','"driver"' }
 }
 buildTypes {
 debug { manifestPlaceholders=[allowCleartext:'true'] }
 release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),'proguard-rules.pro'; manifestPlaceholders=[allowCleartext:'false'] }
 }
}
dependencies {
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'com.google.firebase:firebase-messaging:24.1.1'
}
